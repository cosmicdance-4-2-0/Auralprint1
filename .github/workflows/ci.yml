name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build portable and hosted distributions
        run: npm run build
      - name: Verify portable and hosted packaging contracts
        run: python scripts/verify_distribution.py
      - name: Install pinned Chromium for browser smoke (Ubuntu only)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium --only-shell
      - name: Verify authored Scene camera in built applications (Ubuntu only)
        if: runner.os == 'Linux'
        run: npm run test:browser
      - name: Verify Analysis drafts and CONFIG slider editing (Ubuntu only)
        if: runner.os == 'Linux'
        run: npm run test:browser:editing
      - name: Verify compact preset transport and atomic imports (Ubuntu only)
        if: runner.os == 'Linux'
        run: npm run test:browser:presets
      - name: Verify File Queue and bounded Trace fade (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          git fetch --no-tags --depth=1 origin 33b696a94439d17e86ef26c04a416cbc430754d3 2b53501fe09a9a87688c02487f7e5849f866a51d
          node scripts/validate-116-candidate.cjs
      - name: Verify accessible playback and Queue controls (Ubuntu only)
        if: runner.os == 'Linux'
        run: node scripts/validate-116-accessibility.cjs
      - name: Verify versioned artifact and untracked generated output
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: node {0}
        run: |
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const actualHead = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          assert.equal(actualHead, process.env.EXPECTED_HEAD_SHA, 'CI did not check out the requested head');
          console.log(`Verified exact head ${actualHead}`);
          const version = fs.readFileSync('version', 'utf8').trim();
          assert.match(version, /^v.+/);
          const artifact = `dist/auralprint_${version.slice(1)}.html`;
          assert.ok(fs.statSync(artifact).size > 0, `Empty artifact: ${artifact}`);
          assert.ok(fs.readFileSync(artifact, 'utf8').includes(version), 'Missing version marker');
          const tracked = execFileSync('git', ['ls-files', '--', 'node_modules/', '.build/', 'build/', 'dist/'], { encoding: 'utf8' });
          assert.equal(tracked.trim(), '', `Generated output is tracked: ${tracked}`);
          console.log(`Verified ${artifact}`);
      - name: Check diff whitespace
        run: git diff --check
